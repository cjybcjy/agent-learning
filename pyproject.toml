[project]
name = "heatmap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyahocorasick>=2.1",
  "telethon>=1.36",
  "discord.py>=2.4",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
