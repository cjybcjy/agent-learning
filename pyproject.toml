[project]
name = "heatmap"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pyahocorasick>=2.1",
  "telethon>=1.36",
  "discord.py>=2.4",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
heatmap = "heatmap.scheduler:main"
heatmap-web = "heatmap.web.__main__:main"

[tool.setuptools.packages.find]
include = ["heatmap*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
