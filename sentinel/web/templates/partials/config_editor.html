<form hx-post="/api/config/save"
      hx-target="#config-status"
      hx-swap="innerHTML">
  <input type="hidden" name="filename" value="{{ filename }}">
  <div class="mb-2 text-sm text-slate-600 font-bold">编辑: <span class="mono">{{ filename }}</span></div>
  <textarea name="content" rows="20"
            class="ws-textarea w-full mono text-sm bg-slate-50 leading-relaxed"
  >{{ content }}</textarea>
  <div class="flex gap-3 mt-3">
    <button type="button"
            hx-post="/api/config/validate"
            hx-include="closest form"
            hx-target="#config-status"
            class="ws-button ghost">预校验</button>
    <button type="submit"
            class="ws-button primary">保存并热加载</button>
  </div>
</form>
<div id="config-status" class="mt-3"></div>
